<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self';">
<title>Forge — Paramètres</title>
<link rel="stylesheet" href="lib/theme.css"><link rel="stylesheet" href="lib/settings.css">
<script src="lib/theme.js"></script><script src="lib/session-budget.js"></script><script defer src="lib/settings.js"></script>
</head>
<body>
<main class="settings-layout">
  <header class="settings-heading"><button type="button" id="settingsBack" class="settings-back" data-fr="← Retour" data-en="← Back"></button><div><p class="eyebrow">FORGE</p><h1 data-fr="Paramètres" data-en="Settings"></h1><p data-fr="Choisis une rubrique. Une seule page est affichée à la fois." data-en="Choose a category. Only one page is shown at a time."></p></div><span id="savedToast" role="status" aria-live="polite"></span></header>
  <aside class="settings-menu"><p class="settings-menu-title" data-fr="Rubriques" data-en="Categories"></p><nav id="settingsNav" aria-label="Catégories"></nav><p class="settings-tip" data-fr="Les changements sont enregistrés automatiquement." data-en="Changes are saved automatically."></p></aside>
  <div id="settingsContent">
    <section id="guide" class="settings-section"><h2 data-fr="Bien démarrer" data-en="Getting started"></h2><p data-fr="Les trois étapes utiles pour créer avec Forge." data-en="The three useful steps to create with Forge."></p><div class="settings-card guide-steps"><a href="accounts.html"><strong data-fr="1. Connecter Roblox" data-en="1. Connect Roblox"></strong><span data-fr="Permet aux agents d’accéder à ton expérience Roblox." data-en="Lets agents access your Roblox experience."></span></a><a href="agents.html"><strong data-fr="2. Connecter un agent IA" data-en="2. Connect an AI agent"></strong><span data-fr="Choisis Claude Code ou Codex." data-en="Choose Claude Code or Codex."></span></a><a href="projects.html"><strong data-fr="3. Choisir ou créer un projet" data-en="3. Choose or create a project"></strong><span data-fr="Clique ensuite sur sa carte pour ouvrir son espace de travail." data-en="Then select its card to open the workspace."></span></a></div></section>
    <section id="appearance" class="settings-section"><h2 data-fr="Apparence" data-en="Appearance"></h2><p data-fr="Un affichage confortable, adapté à ton écran." data-en="A comfortable layout for your screen."></p><div id="appearanceRows" class="settings-card"></div></section>
    <section id="agents" class="settings-section"><h2 data-fr="Agents IA" data-en="AI agents"></h2><p data-fr="Choisis combien d’agents de chaque fournisseur lancer à l’ouverture d’un projet. 0 désactive ce démarrage automatique. Chaque fournisseur doit être installé ; sa connexion peut être demandée dans le terminal." data-en="Choose how many agents of each provider launch when a project opens. 0 disables automatic launch. Providers must be installed; sign-in may be requested in the terminal."></p><a href="agents.html" data-fr="Installer ou connecter un fournisseur →" data-en="Install or sign in to a provider →"></a><div id="agentsRows" class="settings-card"></div></section>
    <section id="budget" class="settings-section"><h2 data-fr="Budget de session" data-en="Session budget"></h2><p data-fr="Vérifie la charge prévue avant de lancer plusieurs agents ou un service externe." data-en="Review the expected load before starting several agents or an external service."></p><div id="sessionBudgetSummary" class="session-budget" role="status" aria-live="polite"></div><div id="budgetRows" class="settings-card"></div><div class="paid-confirmation-rule"><strong data-fr="Confirmation payante obligatoire" data-en="Paid confirmation required"></strong><span data-fr="Forge demande toujours une confirmation explicite avant Tripo3D ou une autre opération qui peut consommer des crédits. Cette protection ne peut pas être désactivée." data-en="Forge always asks for explicit confirmation before Tripo3D or another operation that may use credits. This protection cannot be disabled."></span></div></section>
    <section id="providers" class="settings-section"><h2 data-fr="Fournisseurs et coûts" data-en="Providers and costs"></h2><p data-fr="Forge coordonne ces outils, mais leurs comptes, quotas et règles restent séparés." data-en="Forge coordinates these tools, but their accounts, quotas, and rules remain separate."></p><div class="provider-grid"><article><strong>Forge</strong><span data-fr="Application locale de coordination. Elle ne fournit pas d’abonnement IA ni de crédits médias." data-en="Local coordination app. It does not include an AI subscription or media credits."></span></article><article><strong>Claude Code / Codex</strong><span data-fr="Utilisent le compte et le quota du fournisseur que tu connectes." data-en="Use the account and quota of the provider you connect."></span></article><article><strong data-fr="Blender local" data-en="Local Blender"></strong><span data-fr="S’exécute sur ton ordinateur, sans crédit fournisseur. Le rendu utilise les ressources du PC." data-en="Runs on your computer without provider credits. Rendering uses your PC resources."></span></article><article><strong>Roblox</strong><span data-fr="Plateforme externe pour Studio et les uploads. Ses règles et quotas sont ceux affichés par Roblox." data-en="External platform for Studio and uploads. Its rules and quotas are those displayed by Roblox."></span></article><article><strong>Tripo3D</strong><span data-fr="Service média optionnel. Chaque conversion peut consommer les crédits de ta clé ; Forge n’invente pas de prix lorsqu’il ne peut pas le lire." data-en="Optional media service. Each conversion may use credits from your key; Forge does not invent a price when it cannot read it."></span></article></div></section>
    <section id="notifications" class="settings-section"><h2 data-fr="Notifications" data-en="Notifications"></h2><p data-fr="Choisis comment les nouveaux résultats te sont signalés." data-en="Choose how new results are announced."></p><div id="notificationsRows" class="settings-card"></div></section>
    <section id="community" class="settings-section"><h2 data-fr="Partage communautaire" data-en="Community sharing"></h2><p data-fr="Décide quels nouveaux fichiers peuvent être rendus publics. Tout reste privé tant que tu n’actives rien." data-en="Choose which new files may be made public. Everything stays private until you enable it."></p><div id="communityRows" class="settings-card"></div><p class="settings-tip" data-fr="Ce choix s’applique uniquement aux prochains fichiers. Il ne modifie pas ceux qui existent déjà." data-en="This only applies to future files. It does not change existing ones."></p></section>
    <section id="api-services" class="settings-section"><h2 data-fr="Services de création optionnels" data-en="Optional creation services"></h2><p data-fr="Ajoute une clé seulement si tu veux utiliser le service correspondant pour créer des images, modèles 3D ou sons." data-en="Add a key only if you want to use that service to create images, 3D models, or sounds."></p><div id="apiServiceRows" class="settings-card"></div><p class="settings-tip" data-fr="Forge vérifie et chiffre les clés sur cet appareil. Elles ne sont jamais réaffichées." data-en="Forge verifies and encrypts keys on this device. They are never displayed again."></p></section>
    <section id="connections" class="settings-section"><h2 data-fr="Connexions" data-en="Connections"></h2><p data-fr="Connecte les services utilisés par Forge et choisis quels agents peuvent lire tes designs Figma." data-en="Connect the services used by Forge and choose which agents can read your Figma designs."></p><div id="connectionCards" class="connection-cards">
      <article class="connection-card"><div class="connection-card-head"><div><strong>Roblox</strong><span data-fr="Compte, expériences, assets et accès des agents à Studio." data-en="Account, experiences, assets and agent access to Studio."></span></div><span id="robloxConnectionStatus" class="status" role="status">—</span></div><div class="connection-card-actions"><button id="connectRobloxBtn" data-fr="Connecter Roblox" data-en="Connect Roblox"></button><button id="disconnectRobloxBtn" class="secondary" hidden data-fr="Déconnecter" data-en="Disconnect"></button></div></article>
      <article class="connection-card"><div class="connection-card-head"><div><strong>GitHub</strong><span data-fr="Dépôts, sauvegarde du code et collaboration." data-en="Repositories, code backup and collaboration."></span></div><span id="githubConnectionStatus" class="status" role="status">—</span></div><div id="githubDeviceCode" class="device-code" hidden></div><div class="connection-card-actions"><button id="connectGithubBtn" data-fr="Connecter GitHub" data-en="Connect GitHub"></button><button id="disconnectGithubBtn" class="secondary" hidden data-fr="Déconnecter" data-en="Disconnect"></button></div></article>
      <article class="connection-card connection-card-wide"><div class="connection-card-head"><div><strong>Figma</strong><span data-fr="Les agents lisent les frames et ressources, puis recréent l’interface avec des objets GUI Roblox." data-en="Agents read frames and assets, then recreate the interface with Roblox GUI objects."></span></div><span id="figmaConnectionStatus" class="status" role="status">—</span></div><div class="figma-agent-grid"><div><span><strong>Codex</strong><small id="figmaCodexStatus">—</small></span><button id="connectFigmaCodexBtn" data-fr="Connecter" data-en="Connect"></button><button id="disconnectFigmaCodexBtn" class="secondary" hidden data-fr="Déconnecter" data-en="Disconnect"></button></div><div><span><strong>Claude Code</strong><small id="figmaClaudeStatus">—</small></span><button id="connectFigmaClaudeBtn" data-fr="Connecter" data-en="Connect"></button><button id="disconnectFigmaClaudeBtn" class="secondary" hidden data-fr="Déconnecter" data-en="Disconnect"></button></div></div><p class="connection-note" data-fr="Quand tu demandes « transforme cette frame Figma en GUI Roblox », l’agent utilise Figma pour lire le design puis Forge pour créer et vérifier l’interface dans Studio." data-en="When you ask “turn this Figma frame into a Roblox GUI”, the agent uses Figma to read the design and Forge to create and verify the interface in Studio."></p></article>
    </div><div class="settings-card connection-summary"><div id="connectionRows"></div><div class="settings-actions"><button id="checkConnections" data-fr="Actualiser tous les états" data-en="Refresh all statuses"></button><a href="api-keys.html" data-fr="Clés des services médias" data-en="Media service keys"></a></div></div></section>
    <section id="projects" class="settings-section"><h2 data-fr="Projets" data-en="Projects"></h2><p data-fr="Choisis où Forge crée tes nouveaux projets. La connexion à Studio se règle ensuite dans chaque projet." data-en="Choose where Forge creates new projects. Studio connection is then managed inside each project."></p><a href="projects.html" data-fr="Voir mes projets →" data-en="View my projects →"></a></section>
    <section id="diagnostics" class="settings-section"><h2 data-fr="Aide et diagnostic" data-en="Help and diagnostics"></h2><p data-fr="Utilise cette page seulement si quelque chose ne fonctionne pas." data-en="Use this page only when something is not working."></p><div class="settings-card"><div id="diagnosticRows"></div><div class="settings-actions"><button id="runDiagnostics" data-fr="Vérifier Forge" data-en="Check Forge"></button><button id="exportDiagnostics" disabled data-fr="Exporter le rapport" data-en="Export report"></button></div><p class="settings-tip" data-fr="Le rapport contient les versions et les états utiles, sans clés ni compte." data-en="The report contains useful versions and statuses, without keys or account details."></p></div><div class="settings-card" style="margin-top:16px"><div id="updaterRows"></div><div class="settings-actions"><button id="checkUpdates" data-fr="Rechercher une mise à jour" data-en="Check for updates"></button></div></div></section>
    <section id="account" class="settings-section"><h2 data-fr="Compte Forge" data-en="Forge account"></h2><div class="settings-card"><p id="accountEmail">—</p><p data-fr="La déconnexion ferme tes sessions connectées. Tes projets restent sur cet ordinateur." data-en="Signing out closes connected sessions. Your projects stay on this computer."></p><button id="logoutBtn" class="danger" data-fr="Se déconnecter" data-en="Sign out"></button></div></section>
  </div>
</main>
</body></html>
