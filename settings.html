<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self';">
<title>Forge — Paramètres</title>
<link rel="stylesheet" href="lib/theme.css"><link rel="stylesheet" href="lib/settings.css">
<script src="lib/theme.js"></script><script defer src="lib/settings.js"></script>
</head>
<body>
<main class="settings-layout">
  <header class="settings-heading"><div><p class="eyebrow">FORGE / <span data-fr="PRÉFÉRENCES" data-en="PREFERENCES"></span></p><h1 data-fr="Un espace à ta façon." data-en="Make yourself at home."></h1><p data-fr="Personnalise Forge et garde tes connexions sous contrôle." data-en="Personalize Forge and keep track of your connections."></p></div><span id="savedToast" role="status" aria-live="polite"></span></header>
  <aside class="settings-menu"><label for="settingsSearch" data-fr="Rechercher un réglage" data-en="Find a setting"></label><input id="settingsSearch" type="search" placeholder="Rechercher…"><nav id="settingsNav" aria-label="Catégories"></nav><p class="settings-tip" data-fr="Les préférences sont enregistrées automatiquement sur cet appareil." data-en="Preferences are saved automatically on this device."></p></aside>
  <div id="settingsContent">
    <section id="appearance" class="settings-section"><h2 data-fr="Apparence" data-en="Appearance"></h2><p data-fr="Un affichage confortable, adapté à ton écran." data-en="A comfortable layout for your screen."></p><div id="appearanceRows" class="settings-card"></div></section>
    <section id="agents" class="settings-section"><h2 data-fr="Agents IA" data-en="AI agents"></h2><p data-fr="Choisis combien d’agents de chaque fournisseur lancer à l’ouverture d’un projet. 0 désactive ce démarrage automatique. Chaque fournisseur doit être installé ; sa connexion peut être demandée dans le terminal." data-en="Choose how many agents of each provider launch when a project opens. 0 disables automatic launch. Providers must be installed; sign-in may be requested in the terminal."></p><a href="agents.html" data-fr="Installer ou connecter un fournisseur →" data-en="Install or sign in to a provider →"></a><div id="agentsRows" class="settings-card"></div></section>
    <section id="notifications" class="settings-section"><h2 data-fr="Notifications" data-en="Notifications"></h2><p data-fr="Choisis comment les nouveaux résultats te sont signalés." data-en="Choose how new results are announced."></p><div id="notificationsRows" class="settings-card"></div></section>
    <section id="connections" class="settings-section"><h2 data-fr="Connexions" data-en="Connections"></h2><p data-fr="Vérifie séparément ton compte et l’accès de l’IA à Roblox." data-en="Check your account and AI access to Roblox separately."></p><div class="settings-card"><div id="connectionRows"></div><div class="settings-actions"><button id="checkConnections" data-fr="Tester les connexions" data-en="Test connections"></button><a href="accounts.html" data-fr="Gérer les comptes" data-en="Manage accounts"></a><a href="api-keys.html" data-fr="Clés des services médias" data-en="Media service keys"></a></div></div></section>
    <section id="projects" class="settings-section"><h2 data-fr="Stockage des projets" data-en="Project storage"></h2><p data-fr="L’association à Studio, la synchronisation et l’historique se gèrent dans les réglages de chaque projet." data-en="Manage Studio linking, synchronization and file history in each project's settings."></p><a href="projects.html" data-fr="Choisir un projet →" data-en="Choose a project →"></a></section>
    <section id="diagnostics" class="settings-section"><h2 data-fr="Diagnostic" data-en="Diagnostics"></h2><p data-fr="Un état technique utile pour résoudre un problème." data-en="Technical status to help troubleshoot an issue."></p><div class="settings-card"><div id="diagnosticRows"></div><div class="settings-actions"><button id="runDiagnostics" data-fr="Vérifier les outils" data-en="Check tools"></button><button id="exportDiagnostics" disabled data-fr="Exporter le rapport" data-en="Export report"></button></div><p class="settings-tip" data-fr="Le rapport contient uniquement les versions et les états de disponibilité, sans clés, compte, ni chemin personnel." data-en="The report only includes versions and availability, without keys, accounts or personal paths."></p></div></section>
    <section id="account" class="settings-section"><h2 data-fr="Compte Forge" data-en="Forge account"></h2><div class="settings-card"><p id="accountEmail">—</p><p data-fr="La déconnexion ferme tes sessions connectées. Tes projets restent sur cet ordinateur." data-en="Signing out closes connected sessions. Your projects stay on this computer."></p><button id="logoutBtn" class="danger" data-fr="Se déconnecter" data-en="Sign out"></button></div></section>
    <p id="noSettings" hidden data-fr="Aucun réglage trouvé. Essaie un autre mot." data-en="No settings found. Try another word."></p>
  </div>
</main>
</body></html>
