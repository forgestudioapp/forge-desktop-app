<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co;">
<title>Forge — Admin Licences</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--char:#14110E;--char2:#1C1712;--char3:#221C15;--char4:#2A2318;--border:#2C2419;--border-light:#3A3024;--bone:#F3EDE3;--smoke:#948B7C;--smoke-dim:#6B6255;--ember:#3B82F6;--ember-light:#60A5FA;--success:#5FBE7A;--error:#E35B5B;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--char);color:var(--bone);font-family:'Inter',sans-serif;min-height:100vh;padding:40px 20px;}
  .mono{font-family:'JetBrains Mono',monospace;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin-bottom:6px;}
  .sub{color:var(--smoke);font-size:13px;margin-bottom:30px;}
  .card{background:var(--char2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;max-width:700px;}
  .card h2{font-size:15px;margin-bottom:12px;color:var(--ember-light);}
  label{display:block;font-size:12px;color:var(--smoke-dim);margin-bottom:4px;}
  input,select{width:100%;background:var(--char3);border:1px solid var(--border-light);border-radius:8px;padding:10px 12px;color:var(--bone);font-family:'Inter',sans-serif;font-size:13px;margin-bottom:12px;}
  input:focus{outline:none;border-color:var(--ember);}
  .row{display:flex;gap:10px;align-items:flex-end;}
  .row>div{flex:1;}
  button{padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:13px;font-family:'Inter',sans-serif;transition:all .2s;}
  .btn-primary{background:linear-gradient(135deg,var(--ember),var(--ember-light));color:var(--char);}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(59,130,246,0.3);}
  .btn-danger{background:var(--error);color:white;}
  .btn-secondary{background:var(--char3);color:var(--bone);border:1px solid var(--border-light);}
  .btn-secondary:hover{border-color:var(--ember);}
  .result{margin-top:12px;padding:12px;background:var(--char);border:1px solid var(--border);border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:13px;word-break:break-all;display:none;}
  .result.show{display:block;}
  .result.ok{border-color:var(--success);color:var(--success);}
  .result.err{border-color:var(--error);color:var(--error);}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;}
  th{text-align:left;padding:8px;border-bottom:1px solid var(--border);color:var(--smoke-dim);font-weight:500;}
  td{padding:8px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:11px;}
  tr:hover td{background:rgba(59,130,246,0.03);}
  .badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:600;}
  .badge.active{background:var(--success);color:var(--char);}
  .badge.revoked{background:var(--error);color:white;}
  .badge.expired{background:var(--smoke);color:var(--char);}
  .empty{text-align:center;color:var(--smoke-dim);padding:30px;font-size:13px;}
  .copy-btn{padding:4px 10px;font-size:11px;border-radius:6px;background:var(--char3);border:1px solid var(--border-light);color:var(--smoke);cursor:pointer;}
  .copy-btn:hover{color:var(--bone);border-color:var(--ember);}
</style>
</head>
<body>

<h1>Gestion des licences</h1>
<p class="sub">Génère, vérifie et révoque les clés de licence Forge.</p>

<!-- Générer une clé -->
<div class="card">
  <h2>Générer une clé</h2>
  <div class="row">
    <div>
      <label>Email (optionnel)</label>
      <input type="email" id="genEmail" placeholder="client@example.com">
    </div>
    <div>
      <label>Plan</label>
      <select id="genPlan">
        <option value="pro">Pro</option>
        <option value="trial">Essai</option>
      </select>
    </div>
    <button class="btn-primary" onclick="generateKey()">Générer</button>
  </div>
  <div class="result" id="genResult"></div>
</div>

<!-- Vérifier une clé -->
<div class="card">
  <h2>Vérifier une clé</h2>
  <div class="row">
    <div>
      <label>Clé de licence</label>
      <input type="text" id="verifyKey" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" class="mono">
    </div>
    <button class="btn-secondary" onclick="verifyKey()">Vérifier</button>
  </div>
  <div class="result" id="verifyResult"></div>
</div>

<!-- Liste des clés -->
<div class="card">
  <h2>Clés existantes</h2>
  <button class="btn-secondary" onclick="loadKeys()" style="margin-bottom:10px;">Actualiser</button>
  <div id="keysList">
    <div class="empty">Chargement...</div>
  </div>
</div>

<script src="./lib/i18n.js"></script>
<script>
  // Config Supabase — remplace par tes valeurs
  const SUPABASE_URL = ''; // ex: https://xxxxx.supabase.co
  const SUPABASE_SERVICE_KEY = ''; // clé service_role (admin)

  async function supabaseQuery(table, method = 'GET', body = null) {
    if (!SUPABASE_URL || !SUPABASE_SERVICE_KEY) {
      throw new Error('Configure SUPABASE_URL et SUPABASE_SERVICE_KEY dans admin-licenses.html');
    }
    const opts = {
      method,
      headers: {
        'apikey': SUPABASE_SERVICE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_SERVICE_KEY,
        'Content-Type': 'application/json',
        'Prefer': method === 'POST' ? 'return=representation' : undefined,
      },
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + table, opts);
    if (!res.ok) {
      const txt = await res.text();
      throw new Error('Supabase ' + res.status + ': ' + txt.slice(0, 200));
    }
    return res.json();
  }

  function generateRandomKey() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    const segs = [8, 4, 4, 4, 12];
    return segs.map(len => Array.from({length: len}, () => chars[Math.floor(Math.random() * chars.length)]).join('')).join('-');
  }

  async function generateKey() {
    const email = document.getElementById('genEmail').value.trim();
    const plan = document.getElementById('genPlan').value;
    const resultEl = document.getElementById('genResult');

    try {
      const key = generateRandomKey();
      const rows = await supabaseQuery('license_keys', 'POST', {
        license_key: key,
        email: email || null,
        status: 'active',
        plan: plan,
      });
      resultEl.className = 'result show ok';
      resultEl.innerHTML = 'Clé générée : <b>' + key + '</b>' + (email ? '<br>Email : ' + email : '');
      loadKeys();
    } catch (e) {
      resultEl.className = 'result show err';
      resultEl.textContent = 'Erreur : ' + e.message;
    }
  }

  async function verifyKey() {
    const key = document.getElementById('verifyKey').value.trim();
    const resultEl = document.getElementById('verifyResult');
    if (!key) { resultEl.className = 'result show err'; resultEl.textContent = 'Entre une clé.'; return; }

    try {
      const rows = await supabaseQuery('license_keys?license_key=eq.' + encodeURIComponent(key) + '&select=*');
      if (!rows.length) {
        resultEl.className = 'result show err';
        resultEl.textContent = 'Clé introuvable.';
      } else {
        const k = rows[0];
        resultEl.className = 'result show ' + (k.status === 'active' ? 'ok' : 'err');
        resultEl.innerHTML = '<b>' + k.license_key + '</b><br>Statut : ' + k.status + '<br>Email : ' + (k.email || '—') + '<br>Plan : ' + k.plan + '<br>Créée : ' + new Date(k.created_at).toLocaleDateString('fr');
      }
    } catch (e) {
      resultEl.className = 'result show err';
      resultEl.textContent = 'Erreur : ' + e.message;
    }
  }

  async function loadKeys() {
    const container = document.getElementById('keysList');
    try {
      const rows = await supabaseQuery('license_keys?select=*&order=created_at.desc&limit=50');
      if (!rows.length) {
        container.innerHTML = '<div class="empty">Aucune clé.</div>';
        return;
      }
      let html = '<table><thead><tr><th>Clé</th><th>Email</th><th>Plan</th><th>Statut</th><th>Créée</th><th></th></tr></thead><tbody>';
      for (const k of rows) {
        html += '<tr>'
          + '<td>' + k.license_key + '</td>'
          + '<td>' + (k.email || '—') + '</td>'
          + '<td>' + k.plan + '</td>'
          + '<td><span class="badge ' + k.status + '">' + k.status + '</span></td>'
          + '<td>' + new Date(k.created_at).toLocaleDateString('fr') + '</td>'
          + '<td><button class="copy-btn" onclick="navigator.clipboard.writeText(\'' + k.license_key + '\')">Copier</button></td>'
          + '</tr>';
      }
      html += '</tbody></table>';
      container.innerHTML = html;
    } catch (e) {
      container.innerHTML = '<div class="empty" style="color:var(--error);">Erreur : ' + e.message + '</div>';
    }
  }

  // Init
  if (SUPABASE_URL && SUPABASE_SERVICE_KEY) {
    loadKeys();
  } else {
    document.getElementById('keysList').innerHTML = '<div class="empty" style="color:var(--error);">Configure SUPABASE_URL et SUPABASE_SERVICE_KEY dans le fichier admin-licenses.html</div>';
  }
</script>
</body>
</html>
