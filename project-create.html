<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';"><title>Forge — Nouveau projet</title><link rel="stylesheet" href="lib/theme.css"><link rel="stylesheet" href="lib/settings.css"><link rel="stylesheet" href="lib/project-settings.css"><script src="lib/theme.js"></script><script defer src="lib/project-create.js"></script></head>
<body><main class="project-form"><a href="projects.html" data-fr="← Projets" data-en="← Projects"></a><p class="eyebrow">FORGE / LOCAL</p><h1 data-fr="Crée ton projet." data-en="Create your project."></h1><p data-fr="Commence ici, même sans Roblox Studio. Tu pourras associer une place plus tard." data-en="Start here, even without Roblox Studio. You can link a place later."></p><form id="createForm" class="settings-card"><label for="projectNameInput" data-fr="Nom du projet" data-en="Project name"></label><input id="projectNameInput" maxlength="80" required autocomplete="off" placeholder="Mon nouveau jeu"><p class="settings-tip" id="folderHint"></p><fieldset class="starter-examples"><legend data-fr="Exemple de départ (facultatif)" data-en="Starter example (optional)"></legend><p data-fr="Un exemple isolé à examiner avant de modifier ta place Roblox." data-en="An isolated example to inspect before changing your Roblox place."></p><label><input type="radio" name="starterExample" value="" checked><span data-fr="Projet vide" data-en="Empty project"></span></label><label><input type="radio" name="starterExample" value="object"><span><strong data-fr="Petit objet" data-en="Small object"></strong><small data-fr="Un bloc avec un résultat attendu précis." data-en="A block with a precise expected result."></small></span></label><label><input type="radio" name="starterExample" value="interface"><span><strong data-fr="Interface simple" data-en="Simple interface"></strong><small data-fr="Une carte de bienvenue à vérifier en playtest." data-en="A welcome card to verify in a playtest."></small></span></label><label><input type="radio" name="starterExample" value="script"><span><strong data-fr="Modification de script" data-en="Script change"></strong><small data-fr="Avant, après et test ciblé." data-en="Before, after, and a focused test."></small></span></label></fieldset><button id="createBtn" type="submit" data-fr="Créer le projet local" data-en="Create local project"></button></form><p id="creationStatus" role="status" aria-live="polite"></p><div id="createdActions" hidden><a class="action-link" href="workspace.html" data-fr="Ouvrir l’espace de travail →" data-en="Open workspace →"></a><a class="action-link" href="project-settings.html" data-fr="Lier une place Roblox" data-en="Link a Roblox place"></a></div><p class="settings-tip" data-fr="Les outils Studio restent désactivés tant que la place correcte n’est pas associée et connectée. Les comptes et services médias se configurent au moment où tu en as besoin." data-en="Studio tools remain disabled until the correct place is linked and connected. Set up accounts and media services when you need them."></p></main></body></html>
