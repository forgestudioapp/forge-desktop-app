<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';">
  <title>Forge — Nouveau projet</title>
  <link rel="stylesheet" href="lib/theme.css">
  <link rel="stylesheet" href="lib/settings.css">
  <link rel="stylesheet" href="lib/project-settings.css">
  <script src="lib/theme.js"></script>
  <script defer src="lib/project-create.js"></script>
</head>
<body>
  <main class="project-form">
    <h1>Créer un jeu</h1>
    <p>Donne un nom à ton jeu. Forge prépare le reste pour toi.</p>
    <form id="createForm" class="settings-card">
      <label for="projectNameInput">Nom du projet</label>
      <input id="projectNameInput" maxlength="80" required autocomplete="off" placeholder="Mon nouveau jeu">
      <button id="createBtn" type="submit">Créer mon projet</button>
    </form>
    <p id="creationStatus" role="status" aria-live="polite"></p>
    <details id="creationDetails" hidden><summary>Voir les détails</summary><pre id="creationError"></pre></details>
  </main>
</body>
</html>
