<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge — Recuperer ta licence</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--char:#14110E;--char2:#1C1712;--char3:#221C15;--border:#2C2419;--bone:#F3EDE3;--smoke:#948B7C;--ember:#3B82F6;--ember-light:#60A5FA;--success:#5FBE7A;--error:#E35B5B;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--char);color:var(--bone);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:var(--char2);border:1px solid var(--border);border-radius:16px;padding:40px;max-width:450px;width:100%;}
h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin-bottom:8px;}
.sub{color:var(--smoke);font-size:14px;margin-bottom:24px;}
label{display:block;font-size:12px;color:var(--smoke);margin-bottom:4px;}
input{width:100%;background:var(--char3);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--bone);font-size:14px;margin-bottom:16px;}
input:focus{outline:none;border-color:var(--ember);}
button{width:100%;padding:12px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--ember),var(--ember-light));color:var(--char);font-weight:600;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;}
button:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(59,130,246,0.3);}
button:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none;}
.result{margin-top:16px;padding:16px;background:var(--char);border:1px solid var(--border);border-radius:8px;display:none;font-family:'JetBrains Mono',monospace;font-size:14px;word-break:break-all;text-align:center;}
.result.show{display:block;}
.result.ok{border-color:var(--success);color:var(--success);}
.result.err{border-color:var(--error);color:var(--error);}
.key{font-size:16px;color:var(--ember-light);margin:8px 0;}
.help{font-size:12px;color:var(--smoke);margin-top:16px;line-height:1.6;}
</style>
</head>
<body>
<div class="card">
  <h1>Recuperer ta licence</h1>
  <p class="sub">Entre l'email utilise lors de l'achat sur itch.io.</p>
  <form id="form">
    <label>Email</label>
    <input type="email" id="email" placeholder="ton@email.com" required>
    <button type="submit" id="btn">Envoyer ma cle</button>
  </form>
  <div class="result" id="result"></div>
  <div class="help">
    <strong>Comment ca marche :</strong><br>
    1. Entre ton email<br>
    2. Tu recois ta cle par email<br>
    3. Ouvre Forge → Cree un compte → Colle la cle
  </div>
</div>
<script>
const SUPABASE_URL = 'https://quzbsdcjtkmdeuiyyhnv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1emJzZGNqdGttZGV1aXl5aG52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjAwNTksImV4cCI6MjEwMTU5NjA1OX0.ToM71JAeMxTQNFatqcnSPK2xLQIye8vRU1nDmoyyMbE';

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('btn');
  const result = document.getElementById('result');
  if (!email) return;

  btn.disabled = true;
  btn.textContent = 'Envoi en cours...';
  result.className = 'result';

  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/send-license', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur');

    result.className = 'result show ok';
    result.innerHTML = '<div>Ta cle de licence :</div><div class="key">' + data.key + '</div><div style="font-size:12px;color:var(--smoke);margin-top:8px;">Envoyee a ' + email + '</div>';
    btn.textContent = 'Envoye !';
  } catch (err) {
    result.className = 'result show err';
    result.textContent = 'Erreur : ' + err.message;
    btn.disabled = false;
    btn.textContent = 'Envoyer ma cle';
  }
});
</script>
</body>
</html>
