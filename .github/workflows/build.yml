name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone MCP server
        run: git clone https://github.com/forgestudioapp/robloxstudio-mcp.git ../robloxstudio-mcp
      - name: Build MCP server
        working-directory: ../robloxstudio-mcp
        run: npm ci && npm run build
      - name: Install app dependencies
        run: npm ci
      - name: Rebuild node-pty for Electron
        run: npx electron-rebuild -f -w node-pty
      - name: Prepare private runtimes
        run: npm run runtime:prepare:win
      - name: Verify release inputs
        run: npm run release:gate
      - name: Build Windows installer
        run: npx electron-builder --win --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Create permanent Windows website download
        run: node scripts/create-release-aliases.cjs --platform=windows
      - name: Verify and hash Windows installer
        run: node scripts/release-gate.cjs --skip-tests --artifacts dist --manifest dist/release-checksums-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: forge-windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/release-checksums-windows.json

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone MCP server
        run: git clone https://github.com/forgestudioapp/robloxstudio-mcp.git ../robloxstudio-mcp
      - name: Build MCP server
        working-directory: ../robloxstudio-mcp
        run: npm ci && npm run build
      - name: Install app dependencies
        run: npm ci
      - name: Rebuild node-pty for Electron
        run: npx electron-rebuild -f -w node-pty
      - name: Prepare private runtimes
        run: npm run runtime:prepare:mac
      - name: Verify release inputs
        run: npm run release:gate
      - name: Build macOS DMG
        run: npm run dist:mac:release -- --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Create permanent macOS website downloads
        run: node scripts/create-release-aliases.cjs --platform=macos
      - name: Verify Apple signature and notarization ticket
        shell: bash
        run: |
          set -euo pipefail
          app_count="$(find dist -type d -name 'Forge.app' | wc -l | tr -d ' ')"
          test "$app_count" -gt 0
          while IFS= read -r -d '' app_path; do
            codesign --verify --deep --strict --verbose=2 "$app_path"
            xcrun stapler validate "$app_path"
            spctl --assess --type execute --verbose=2 "$app_path"
          done < <(find dist -type d -name 'Forge.app' -print0)
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          test "${#dmgs[@]}" -gt 0
      - name: Verify and hash macOS installer
        run: node scripts/release-gate.cjs --skip-tests --artifacts dist --manifest dist/release-checksums-macos.json
      - uses: actions/upload-artifact@v4
        with:
          name: forge-macos
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/latest-mac.yml
            dist/release-checksums-macos.json

  publish:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: forge-*
          path: release-assets
          merge-multiple: true
      - name: Publish only verified artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
