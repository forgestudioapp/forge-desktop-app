<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>Forge — Assets</title><link rel="stylesheet" href="lib/theme.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--char);color:var(--bone);font:13px Inter,Arial,sans-serif}header{display:flex;align-items:center;gap:16px;padding:15px 24px;border-bottom:1px solid var(--border-light)}header h1{font-size:20px;margin:0}button,select{background:var(--char3);border:1px solid var(--border-light);color:var(--bone);border-radius:7px;padding:8px 11px;cursor:pointer}button:hover{border-color:var(--ember)}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ember-light);outline-offset:2px}button:disabled{opacity:.45;cursor:default}.spacer{flex:1}main{padding:24px;max-width:1350px;margin:auto}.filters{display:flex;gap:10px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}.card{background:var(--char2);border:1px solid var(--border-light);border-radius:12px;overflow:hidden}.preview{height:165px;background:var(--char3);display:flex;align-items:center;justify-content:center;color:var(--smoke);font-size:34px}.preview img{width:100%;height:100%;object-fit:contain}.body{padding:14px}.name{font-size:15px;font-weight:700;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--smoke);line-height:1.6;margin:8px 0}.actions{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.actions button{font-size:11px;padding:7px 10px}.actions .primary{background:var(--ember);border-color:var(--ember);color:var(--char);font-weight:700}.history{margin-top:12px;border-top:1px solid var(--border-light);padding-top:10px;color:var(--smoke)}.history summary{cursor:pointer}.revision{padding:6px 0;border-bottom:1px solid var(--border-light);font-size:11px}.error{color:#f18a86}.notice{min-height:20px;margin-bottom:12px;color:var(--smoke)}label{color:var(--smoke)}@media(max-width:720px){header{padding:12px;flex-wrap:wrap}main{padding:14px}}
</style></head><body><header><button onclick="location.href='workspace.html'">← Projet</button><h1>Assets</h1><span id="projectName"></span><span class="spacer"></span><button onclick="location.href='thumbnail.html'">Atelier médias</button></header><main><div class="filters"><label>Type <select id="typeFilter"><option value="">Tous</option><option value="image">Images</option><option value="model3d">Modèles 3D</option><option value="audio">Sons</option><option value="animation">Animations</option><option value="vfx">VFX</option><option value="interface">Interfaces</option></select></label><label>État <select id="stateFilter"><option value="">Tous</option><option value="in-progress">En cours</option><option value="draft">Brouillon</option><option value="needs-review">À valider</option><option value="validated">Validé</option><option value="rejected">Refusé</option><option value="failed">Échec</option><option value="published">Publié sur Roblox</option></select></label></div><div class="notice" id="notice"></div><div class="grid" id="grid"></div></main>
<script>
let project=null,assets=[];
const labels={image:'Image',model3d:'Modèle 3D',audio:'Son',animation:'Animation',vfx:'VFX',interface:'Interface'};
const states={'in-progress':'En cours',draft:'Brouillon','needs-review':'À valider',validated:'Validé',rejected:'Refusé',failed:'Échec',published:'Publié sur Roblox'};
function note(message,error=false){const node=document.getElementById('notice');node.textContent=message;node.classList.toggle('error',error);}
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;}
function button(text,action){const node=el('button',text);node.onclick=action;return node;}
async function refresh(){const response=await window.forgeAPI.assetCatalogList(project.path);if(response.error){note(response.error,true);return;}assets=response.assets||[];render();}
async function act(asset,action,options){const response=await window.forgeAPI.assetCatalogAction(project.path,asset.id,action,options);if(response.error){note(response.error,true);return false;}note(action==='accept'?'Révision validée. L’agent peut poursuivre avec cette version.':action==='redo'?'Nouvelle révision créée. Générez le fichier dans l’Atelier puis associez-le ici.':'Asset mis à jour.');await refresh();return true;}
async function publish(asset){const insert=confirm('Publier sur Roblox ?\nOK : publier et demander l’insertion dans la place liée.\nAnnuler : choisir uniquement la publication dans la boîte suivante.');if(!insert&&!confirm('Publier sur Roblox sans insertion dans Studio ?'))return;note('Publication en cours…');const response=await window.forgeAPI.assetCatalogPublish(project.path,asset.id,insert);if(response.error){note(response.error,true);await refresh();return;}const item=response.asset;note(item.insertion?.error?'Publié sur Roblox (ID '+item.robloxAssetId+'), mais insertion non confirmée : '+item.insertion.error:'Publié sur Roblox : ID '+item.robloxAssetId);await refresh();}
async function attach(asset){const response=await window.forgeAPI.assetCatalogAttach(project.path,asset.id);if(response.error)note(response.error,true);else if(!response.canceled){note('Nouvelle révision prête à valider.');await refresh();}}
async function preview(card,asset){const box=card.querySelector('.preview');if(asset.type!=='image'&&asset.type!=='model3d')return;let file=asset.localFile;if(asset.type==='model3d'){file=file.replace(/\.[^.]+$/,'-preview.png');}const response=await window.forgeAPI.mediaPreview(project.path,file);if(response.dataUrl&&box.isConnected){const img=el('img');img.alt='Aperçu de '+asset.name;img.src=response.dataUrl;box.replaceChildren(img);}}
function render(){const grid=document.getElementById('grid');grid.replaceChildren();const type=document.getElementById('typeFilter').value,state=document.getElementById('stateFilter').value;const shown=assets.filter(a=>(!type||a.type===type)&&(!state||a.status===state));if(!shown.length){grid.append(el('p','Aucun asset pour ces filtres.'));return;}for(const asset of shown){const card=el('article',undefined,'card'),box=el('div',asset.type==='model3d'?'◇':'▧','preview'),body=el('div',undefined,'body'),name=el('div',asset.name,'name'),meta=el('div',`${labels[asset.type]||asset.type} · ${states[asset.status]||asset.status}`,'meta'),actions=el('div',undefined,'actions');body.append(name,meta);if(['draft','needs-review','rejected'].includes(asset.status)){const accept=button('Accepter',()=>act(asset,'accept'));accept.className='primary';actions.append(accept);}actions.append(button('Refaire',()=>{const prompt=window.prompt('Que veux-tu changer ?',asset.prompt||'');if(prompt!==null)act(asset,'redo',{prompt});}));if(asset.status==='validated'){const publishButton=button('Publier',()=>publish(asset));publishButton.className='primary';actions.append(publishButton);}body.append(actions);const more=el('details',undefined,'history');more.append(el('summary','Plus d’actions et détails'));const technical=el('div',`${asset.agent||'Utilisateur'} · ${asset.provider||'Outil inconnu'}${asset.cost==null?'':' · Coût : '+asset.cost}\n${asset.localFile||'Fichier à associer'}${asset.robloxAssetId?'\nRoblox ID : '+asset.robloxAssetId:''}${asset.uploadError?'\nErreur : '+asset.uploadError:''}`,'meta');technical.style.whiteSpace='pre-line';more.append(technical);const other=el('div',undefined,'actions');if(asset.status==='in-progress')other.append(button('Associer un fichier',()=>attach(asset)));if(asset.status!=='published')other.append(button('Refuser',()=>act(asset,'reject')));other.append(button('Exporter',async()=>{const r=await window.forgeAPI.assetCatalogExport(project.path,asset.id);if(r.error)note(r.error,true);else if(r.saved)note('Exporté : '+r.saved);}));other.append(button('Supprimer',()=>{if(confirm('Retirer cet asset du catalogue ? Les fichiers locaux et les révisions restent sur disque.'))act(asset,'delete');}));more.append(other);const history=el('details',undefined,'history'),summary=el('summary',`Historique · ${asset.revisions.length} révision(s)`);history.append(summary);for(const revision of asset.revisions){const row=el('div',`#${revision.number} · ${states[revision.status]||revision.status} · ${new Date(revision.createdAt).toLocaleString()}\n${revision.prompt||''}\n${revision.snapshot||'Fichier en attente'}`,'revision');row.style.whiteSpace='pre-line';history.append(row);}more.append(history);body.append(more);card.append(box,body);grid.append(card);preview(card,asset);}}
document.getElementById('typeFilter').onchange=render;document.getElementById('stateFilter').onchange=render;
(async()=>{try{const response=await window.forgeAPI.getActiveProject();if(response?.error)throw new Error(response.error);project=response?.project;if(!project){note('Aucun projet actif. Ouvre un projet depuis la liste.',true);return;}document.getElementById('projectName').textContent=project.name||project.path;await refresh();}catch(error){note('Impossible de charger le projet : '+(error.message||String(error)),true);}})();
</script></body></html>
