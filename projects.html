<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co file:; media-src 'self' blob: https://*.supabase.co; connect-src 'self';">
<title>Forge — Projets</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/theme.css">
<script src="lib/theme.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--char); color:var(--bone); font-family:'Inter',sans-serif; min-height:100vh; padding:80px 40px 40px; opacity:0; animation:pageIn 0.35s cubic-bezier(.4,0,.2,1) forwards;}
  body::before {
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(ellipse 80% 50% at 20% 40%, rgba(59,130,246,0.04), transparent),
      radial-gradient(ellipse 60% 40% at 80% 60%, rgba(96,165,250,0.02), transparent);
    animation:aurora 20s ease-in-out infinite alternate;
  }
  @keyframes aurora {
    0%{transform:translate(0,0) scale(1);} 33%{transform:translate(2%,-1%) scale(1.02);}
    66%{transform:translate(-1%,2%) scale(0.98);} 100%{transform:translate(1%,-2%) scale(1.01);}
  }
  body::after {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat:repeat; background-size:256px 256px;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  .top-bar{position:fixed; top:26px; right:30px; display:flex; align-items:center; gap:10px; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--smoke-dim); z-index:10;}
  .top-bar b{color:var(--bone);}

  .wrap{max-width:960px; margin:0 auto; position:relative; z-index:2;}

  .studio-bar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--input-bg); backdrop-filter:blur(20px) saturate(1.3); -webkit-backdrop-filter:blur(20px) saturate(1.3);
    border:1px solid rgba(59,130,246,0.1); border-radius:14px; padding:14px 18px; margin-bottom:26px;
    box-shadow:0 8px 32px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.02);
    transition:all 0.3s cubic-bezier(.4,0,.2,1);
    position:relative; overflow:hidden; z-index:2;
    animation:fadeInUp 0.5s ease forwards;
  }
  .studio-bar::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg,transparent,rgba(59,130,246,0.15),transparent);
  }
  .studio-bar:hover{
    border-color:rgba(59,130,246,0.15);
    box-shadow:0 12px 40px rgba(0,0,0,0.2);
    transform:translateY(-1px);
  }
  .studio-bar.hidden{display:none;}
  .studio-left{display:flex; align-items:center; gap:12px;}
  .studio-icon{width:34px;height:34px;border-radius:9px; background:var(--ember-dim); display:flex; align-items:center; justify-content:center; font-size:16px;}
  .studio-tag{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ember-light); letter-spacing:0.06em; margin-bottom:2px;}
  .studio-title{font-size:14px; font-weight:600;}
  .studio-sub{font-size:11.5px; color:var(--smoke-dim); margin-top:1px;}
  .studio-actions{display:flex; gap:8px;}
  .btn-mini{
    padding:8px 14px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;
    border:1px solid var(--border-light); background:var(--char3); color:var(--bone); font-family:'Inter',sans-serif;
    transition:all 0.2s cubic-bezier(.4,0,.2,1);
  }
  .btn-mini.primary{
    background:linear-gradient(135deg,var(--ember),var(--ember-light)); color:var(--char); border:none;
    box-shadow:0 4px 12px rgba(59,130,246,0.2), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .btn-mini.primary:hover{transform:translateY(-1px); box-shadow:0 6px 16px rgba(59,130,246,0.3);}
  .btn-mini:hover{border-color:var(--ember); color:var(--ember-light);}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; position:relative; z-index:2; animation:fadeInUp 0.5s 0.08s ease forwards; opacity:0;}
  .section-head h1{font-family:'Space Grotesk',sans-serif; font-size:20px;}
  .head-actions{display:flex; gap:8px;}

  .proj-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; position:relative; z-index:2;}
  @media(max-width:760px){.proj-grid{grid-template-columns:repeat(2,1fr);}}

  .proj-card{
    background:var(--card-bg); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(59,130,246,0.05); border-radius:12px; padding:16px;
    cursor:pointer; transition:all 0.3s cubic-bezier(.4,0,.2,1); position:relative; overflow:hidden;
    box-shadow:0 4px 16px rgba(0,0,0,0.06);
    animation:fadeInUp 0.5s ease forwards; opacity:0;
  }
  .proj-card:nth-child(1){animation-delay:0.12s;}
  .proj-card:nth-child(2){animation-delay:0.18s;}
  .proj-card:nth-child(3){animation-delay:0.24s;}
  .proj-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg,transparent,rgba(59,130,246,0.08),transparent);
    opacity:0; transition:opacity 0.3s ease;
  }
  .proj-card:hover::before{opacity:1;}
  .proj-card:hover{
    border-color:rgba(59,130,246,0.1);
    box-shadow:0 16px 40px rgba(0,0,0,0.2);
    transform:translateY(-4px);
  }
  .proj-card.active{
    border-color:var(--ember);
    background:rgba(59,130,246,0.05);
    box-shadow:0 0 0 1px rgba(59,130,246,0.1), 0 8px 24px rgba(59,130,246,0.1);
  }
  .proj-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .proj-name{font-weight:700; font-size:14px; display:flex; align-items:center; gap:7px;}
  .proj-badge{
    font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--ember-light);
    border:1px solid var(--ember); padding:2px 8px; border-radius:100px;
  }
  .proj-path{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--smoke-dim); margin-bottom:10px; word-break:break-all;}
  .proj-repo{font-size:11px; color:var(--smoke); display:flex; align-items:center; gap:5px;}
  .proj-repo.local{color:var(--smoke-dim);}

  .proj-delete{
    position:absolute; top:10px; right:10px; width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    border:none; background:transparent; color:var(--smoke-dim);
    border-radius:6px; cursor:pointer; opacity:0; transition:all 0.2s ease; z-index:5;
  }
  .proj-card:hover .proj-delete{opacity:1;}
  .proj-delete:hover{background:rgba(239,68,68,0.12); color:#ef4444;}
  .proj-delete svg{pointer-events:none;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; z-index:1000;
    opacity:0; pointer-events:none; transition:opacity 0.25s ease;
  }
  .modal-overlay.open{opacity:1; pointer-events:auto;}
  .modal-box{
    background:var(--char2); border:1px solid var(--border); border-radius:14px;
    padding:24px 28px; min-width:360px; max-width:420px;
    box-shadow:0 24px 64px rgba(0,0,0,0.4); transform:translateY(12px); transition:transform 0.25s ease;
  }
  .modal-overlay.open .modal-box{transform:translateY(0);}
  .modal-title{font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; margin-bottom:8px;}
  .modal-desc{font-size:13px; color:var(--smoke); margin-bottom:20px; line-height:1.5;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end;}
  .modal-btn{
    padding:8px 16px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;
    border:1px solid var(--border-light); background:var(--char3); color:var(--bone);
    font-family:'Inter',sans-serif; transition:all 0.2s ease;
  }
  .modal-btn:hover{border-color:var(--smoke);}
  .modal-btn.danger{background:#ef4444; border-color:#ef4444; color:#fff;}
  .modal-btn.danger:hover{background:#dc2626; border-color:#dc2626;}
  .modal-check{display:flex; align-items:center; gap:8px; margin-bottom:16px; font-size:12.5px; color:var(--smoke); cursor:pointer;}
  .modal-check input{accent-color:var(--ember); cursor:pointer;}

  .new-card{
    background:var(--card-bg); border:1px dashed var(--border-light); border-radius:12px; padding:16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    cursor:pointer; min-height:96px; color:var(--smoke);
    transition:all 0.3s cubic-bezier(.4,0,.2,1); position:relative; overflow:hidden;
    animation:fadeInUp 0.5s 0.30s ease forwards; opacity:0;
  }
  .new-card:hover{border-color:var(--ember); color:var(--ember-light); background:rgba(59,130,246,0.03); transform:translateY(-2px);}
  .new-card .plus{font-size:22px; margin-bottom:4px;}

  .step-footer{position:fixed; bottom:26px; left:30px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--smoke-dim); z-index:10;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pageIn{from{opacity:0;}to{opacity:1};}
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-track{background:transparent;} ::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px;} ::-webkit-scrollbar-thumb:hover{background:var(--ember-dim);}
</style>
<base target="_blank">
</head>
<body>

  <div class="top-bar">
    SYSTEM ·
    <a href="settings.html?from=projects.html" target="_self" title="Paramètres" style="cursor:pointer;padding:4px;border-radius:5px;display:inline-flex;align-items:center;color:var(--smoke-dim);text-decoration:none;transition:color .15s ease,background .15s ease;" onmouseover="this.style.color='var(--ember-light)';this.style.background='var(--char3)'" onmouseout="this.style.color='var(--smoke-dim)';this.style.background='transparent'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </a>
  </div>

  <div class="wrap">
    <div class="studio-bar hidden" id="studioBar">
      <div class="studio-left">
        <div class="studio-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
        </div>
        <div>
          <div class="studio-tag">ROBLOX STUDIO</div>
          <div class="studio-title" id="studioTitle" data-i18n="studio_not_open">Studio non ouvert</div>
          <div class="studio-sub" id="studioSub" data-i18n="studio_open_hint">Ouvre un projet dans Roblox Studio pour le lier ici.</div>
        </div>
      </div>
      <div class="studio-actions">
        <button class="btn-mini primary" id="openStudioBtn" data-i18n="open">Ouvrir</button>
      </div>
    </div>

    <div class="section-head">
      <h1 data-i18n="my_projects">Select a Project</h1>
      <div class="head-actions">
        <button class="btn-mini" id="refreshBtn" data-i18n="refresh">Actualiser</button>
        <button class="btn-mini primary" id="newProjectBtn" data-i18n="new_project">+ New Project</button>
      </div>
    </div>

    <div class="proj-grid" id="projGrid">
      <div class="new-card" id="newCard">
        <div class="plus">+</div>
        <div data-i18n="create_project">New Project</div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
      <div class="modal-title" data-i18n="delete_project">Supprimer le projet</div>
      <div class="modal-desc" id="deleteModalDesc"></div>
      <label class="modal-check">
        <input type="checkbox" id="deleteFilesCheck" checked>
        <span data-i18n="delete_project_confirm">Supprimer le dossier du disque</span>
      </label>
      <div class="modal-actions">
        <button class="modal-btn" id="deleteCancelBtn" data-i18n="cancel">Annuler</button>
        <button class="modal-btn danger" id="deleteConfirmBtn" data-i18n="delete_project">Supprimer</button>
      </div>
    </div>
  </div>

  <div class="step-footer mono" data-i18n="forge_projects">Forge Projects</div>

<script src="./lib/i18n.js"></script>
<script src="./lib/ux.js"></script>
<script>
  (function(){ if(window.forgeAPI && window.forgeAPI.isForgeConnected){ window.forgeAPI.isForgeConnected().then(function(res){ if(!res.connected) window.location.href = 'login.html'; }); } })();
  initLang();
  const projGrid = document.getElementById('projGrid');
  const studioBar = document.getElementById('studioBar');
  const studioTitle = document.getElementById('studioTitle');
  const studioSub = document.getElementById('studioSub');
  let activeProject = null;
  let projects = [];

  function fadeNavigate(href){
    document.body.style.opacity = '0';
    document.body.style.transition = 'opacity 0.2s ease';
    setTimeout(() => window.location.href = href, 200);
  }

  document.getElementById('newProjectBtn').addEventListener('click', () => fadeNavigate('project-create.html'));
  document.getElementById('newCard').addEventListener('click', () => fadeNavigate('project-create.html'));
  document.getElementById('refreshBtn').addEventListener('click', loadProjects);

  async function loadProjects(){
    if(!window.forgeAPI || !window.forgeAPI.listProjects){
      renderProjects([]);
      return;
    }
    try {
      const res = await window.forgeAPI.listProjects();
      projects = res.projects || [];
      renderProjects(projects);
    } catch(e) {
      console.error('Erreur chargement projets:', e);
      renderProjects([]);
    }
  }

  async function loadActiveProject(){
    if(!window.forgeAPI || !window.forgeAPI.getActiveProject) return;
    try {
      const res = await window.forgeAPI.getActiveProject();
      if(res.project){
        activeProject = res.project;
        studioBar.classList.remove('hidden');
        studioTitle.textContent = t('studio_open_on') + res.project.name;
        studioSub.textContent = t('studio_linked');
      } else {
        studioBar.classList.add('hidden');
      }
    } catch(e) {
      studioBar.classList.add('hidden');
    }
  }

  const deleteModal = document.getElementById('deleteModal');
  const deleteModalDesc = document.getElementById('deleteModalDesc');
  const deleteFilesCheck = document.getElementById('deleteFilesCheck');
  const deleteCancelBtn = document.getElementById('deleteCancelBtn');
  const deleteConfirmBtn = document.getElementById('deleteConfirmBtn');
  let deleteTarget = null;

  function openDeleteModal(proj){
    deleteTarget = proj;
    deleteFilesCheck.checked = true;
    deleteModalDesc.textContent = proj.name + ' — ' + t('delete_project_confirm');
    deleteModal.classList.add('open');
  }

  deleteCancelBtn.addEventListener('click', () => {
    deleteModal.classList.remove('open');
    deleteTarget = null;
  });

  deleteModal.addEventListener('click', (e) => {
    if(e.target === deleteModal){
      deleteModal.classList.remove('open');
      deleteTarget = null;
    }
  });

  deleteConfirmBtn.addEventListener('click', async () => {
    if(!deleteTarget) return;
    const deleteFiles = deleteFilesCheck.checked;
    const path = deleteTarget.path;
    deleteModal.classList.remove('open');
    deleteTarget = null;

    if(!window.forgeAPI || !window.forgeAPI.deleteProject){
      forgeToast('API non disponible', 'error');
      return;
    }

    try {
      const res = await window.forgeAPI.deleteProject(path, deleteFiles);
      if(res.error){
        forgeToast(res.error, 'error');
      } else {
        forgeToast((t('delete_project') || 'Projet supprimé') + ' : ' + res.name, 'success');
        loadActiveProject().then(() => loadProjects());
      }
    } catch(e){
      forgeToast('Erreur : ' + e.message, 'error');
    }
  });

  function renderProjects(list){
    projGrid.innerHTML = '';

    list.forEach((proj, index) => {
      const card = document.createElement('div');
      card.className = 'proj-card';
      if(activeProject && activeProject.path === proj.path){
        card.classList.add('active');
      }
      card.style.animationDelay = (0.12 + index * 0.06) + 's';

      const isActive = activeProject && activeProject.path === proj.path;
      const badgeHtml = isActive ? '<span class="proj-badge">Open in Studio</span>' : '';

      const deleteBtnHtml = '<button class="proj-delete" data-tooltip="' + (t('delete_project') || 'Supprimer') + '"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>';

      card.innerHTML = `
        ${deleteBtnHtml}
        <div class="proj-top">
          <div class="proj-name">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
            ${proj.name}
          </div>
          ${badgeHtml}
        </div>
        <div class="proj-path">${proj.path}</div>
        <div class="proj-repo local">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
          Local only
        </div>
      `;

      card.querySelector('.proj-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        openDeleteModal(proj);
      });

      card.addEventListener('click', async () => {
        if(window.forgeAPI && window.forgeAPI.setActiveProject){
          await window.forgeAPI.setActiveProject(proj.path);
        }
        fadeNavigate('workspace.html');
      });

      projGrid.appendChild(card);
    });

    const newCard = document.createElement('div');
    newCard.className = 'new-card';
    newCard.innerHTML = '<div class="plus">+</div><div>New Project</div>';
    newCard.addEventListener('click', () => fadeNavigate('project-create.html'));
    projGrid.appendChild(newCard);
  }

  loadActiveProject().then(() => loadProjects());
</script>

</body>
</html>
